# Bundle that deploys the Healthcare Claims Analytics dashboard,
# which is backed by the metric view madams.data_mart.claims_metrics.
bundle:
  name: claims_metrics_dashboard

include:
  - resources/*.yml

variables:
  warehouse_id:
    description: SQL warehouse used by the dashboard
    lookup:
      warehouse: 'Serverless SQL Warehouse'
  catalog:
    description: Catalog containing the claims_metrics metric view (applied via dataset_catalog)
    default: madams
  schema:
    description: Schema containing the claims_metrics metric view (applied via dataset_schema)
    default: data_mart

# The workspace host is not pinned here. The CLI resolves it from your auth
# profile or DATABRICKS_HOST, e.g. `databricks bundle deploy -t dev -p <profile>`.
targets:
  dev:
    default: true
    mode: development
    variables:
      catalog: madams
      schema: data_mart

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      # Placeholder: point this at the catalog/schema that holds the prod claims_metrics metric view
      catalog: madams_prod
      schema: data_mart
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
